<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Legal Analysis — LexiGuard</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        moss: '#2E4036',
                        clay: {
                            DEFAULT: '#CC5833',
                            hover: '#b54927',
                        },
                        cream: '#F2F0E9',
                        obsidian: {
                            DEFAULT: '#0D1612',
                            dark: '#080E0B',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        heading: ['"Outfit"', '"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
                        mono: ['"IBM Plex Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-obsidian text-cream font-sans antialiased min-h-screen p-6 md:p-12">

    <!-- Global SVG Noise Texture Overlay -->
    <div class="fixed inset-0 pointer-events-none z-50 opacity-[0.045] mix-blend-overlay">
        <svg class="w-full h-full">
            <filter id="noiseFilter">
                <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
            </filter>
            <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
        </svg>
    </div>

    <div class="max-w-4xl mx-auto">
        <!-- Brand Header -->
        <div class="flex items-center justify-between mb-8 pb-6 border-b border-cream/10">
            <a href="/" class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-full bg-clay/20 border border-clay/40 flex items-center justify-center text-clay">
                    <i data-lucide="shield-alert" class="w-5 h-5"></i>
                </div>
                <span class="font-extrabold text-xl text-cream">
                    Lexi<span class="text-clay font-serif italic text-2xl">Guard</span>
                </span>
            </a>
            <span class="text-xs font-mono text-clay px-3 py-1 rounded-full bg-clay/10 border border-clay/30">
                SHARED DISSECTION ARTIFACT
            </span>
        </div>

        <div id="loading" class="text-center py-20 text-cream/50 font-mono text-sm">
            Retrieving shared analysis details...
        </div>

        <div id="content" class="hidden space-y-8">
            <div class="bg-moss/50 border border-cream/10 rounded-[2.5rem] p-8 shadow-2xl">
                <span id="doc-type" class="text-xs font-mono text-clay uppercase tracking-widest block mb-2">Legal Document</span>
                <h1 id="filename" class="text-3xl font-extrabold text-cream mb-2">Document Analysis</h1>
                <p class="text-xs text-cream/60 font-mono">Shared report snapshot generated by LexiGuard AI Engine</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Summary -->
                <div class="bg-moss/40 border border-cream/10 rounded-[2.2rem] p-8">
                    <div class="flex items-center gap-3 mb-4 text-emerald-400">
                        <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                        <h3 class="text-lg font-bold text-cream">Summary & Action Checklist</h3>
                    </div>
                    <div id="summary-text" class="text-xs text-cream/80 font-light leading-relaxed whitespace-pre-line"></div>
                </div>

                <!-- Risk Radar -->
                <div class="bg-moss/40 border border-clay/30 rounded-[2.2rem] p-8">
                    <div class="flex items-center gap-3 mb-4 text-clay">
                        <i data-lucide="radar" class="w-5 h-5"></i>
                        <h3 class="text-lg font-bold text-cream">Risk Radar & Flagged Clauses</h3>
                    </div>
                    <div id="risk-text" class="text-xs text-cream/80 font-light leading-relaxed whitespace-pre-line"></div>
                </div>
            </div>

            <div class="text-center pt-8">
                <a href="/" class="magnetic-btn inline-flex items-center gap-2 px-6 py-3 rounded-full bg-clay hover:bg-clay-hover text-white text-xs font-bold font-mono tracking-wide shadow-xl">
                    <span>Dissect Your Own Document</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </a>
            </div>
        </div>
    </div>

    <script type="module" src="share.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
